plugins {
    id 'com.android.application'
}

// Each build on GitHub gets a higher version number, so a new APK installs over the old one
// (and the box keeps the website's sign-in and the app's settings).
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// Firefox's engine (GeckoView), inside the app for boxes whose own engine is too old for the websites: the one
// Twilight TV uses, for 32-bit ARM, which runs on every TV box. -Pgeckoabi=x86_64 builds it for the emulators
// on GitHub instead (tests/try).
def geckoView = '157.0.20261005135250'
def geckoAbi = (project.findProperty('geckoabi') ?: 'armeabi-v7a').toString()

android {
    namespace = 'com.twilightcafe.movies'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1                        // the same tools as Twilight TV
        }
    }

    defaultConfig {
        applicationId = 'com.twilightcafe.movies'
        minSdk = 23                                  // Android 6.0 and newer, as AndroidX (Firefox's engine: 8.0)
        targetSdk = 35
        versionCode = buildNumber
        versionName = "1.${buildNumber}"
        // The GitHub repository the app is built from: new versions come from its releases
        // (empty on a computer, so a build made there never updates itself)
        buildConfigField "String", "REPO", "\"" + (System.getenv('GITHUB_REPOSITORY') ?: '') + "\""
        // -Ppagelog (the try builds, on GitHub's emulators): the websites' own messages in Android's log. Never on
        // the boxes: some websites take a browser that hands their messages on for one with its tools open, and
        // go blank; and a website that writes a lot of them is slower
        buildConfigField "boolean", "PAGE_LOG", project.hasProperty('pagelog') ? 'true' : 'false'
        // -Pstudy (the websites' study on GitHub's emulators, study.yml): what the websites' pages ask their data feeds,
        // kept by the app (assets/gecko/study.js, web/gecko/StudyFile). Never on the boxes either
        buildConfigField "boolean", "STUDY", project.hasProperty('study') ? 'true' : 'false'
        ndk {
            abiFilters.add(geckoAbi)
        }
    }

    packaging {
        // Firefox's engine compressed inside the APK (a 90 MB download, not 160); the box unpacks it as it installs
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // the same licence and Java-module files come with several of its libraries
            excludes.addAll(['META-INF/versions/9/module-info.class', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                             'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module'])
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // The same key signs every build; Android only updates an app signed with the same key.
    signingConfigs {
        release {
            storeFile = file('twilight-movies.keystore')
            storeType = 'pkcs12'
            storePassword = 'twilight-movies-key'
            keyAlias = 'twilight-movies'
            keyPassword = 'twilight-movies-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview-${geckoAbi}:${geckoView}"
}
