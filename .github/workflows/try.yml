name: Try the app

# On GitHub's machines, which reach the websites: the website opened in Chromium the way a TV box asks for it
# (tests/try/website.js), which web engine its scripts need, what the app's ad blocker would block there, and the
# app itself on two Android TV emulators: one with a web engine from 2018 like the café's box, one with a new
# one (tests/try/emulator.sh). The screenshots and logs go to the pre-release "try". Runs on a push to a branch
# named try/..., or by hand from the Actions tab.
on:
  push:
    branches: ['try/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: try
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: The pre-release for what it sees
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view try > /dev/null 2>&1 || gh release create try --prerelease --latest=false \
            --title "Tried on GitHub" \
            --notes "Screenshots and logs of the app and its websites, from .github/workflows/try.yml. Nothing to install."

  website:
    name: The website in Chromium
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Chromium, and a JavaScript parser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 acorn@8.14.0
          npx playwright install --with-deps chromium
      - name: KurdFilm, as the café's box asks for it
        run: node tests/try/website.js out/website https://app.kurdfilm.krd/tv
      - name: Which web engine its scripts need
        run: node tests/try/syntax.js out/website | tee out/website/syntax.txt
      - name: What the app's ad blocker would block there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download filters -p filters.bin -D out --clobber
          mkdir -p out/classes
          javac -nowarn -d out/classes $(find app/src/main/java/com/twilightcafe/movies/adblock/engine -name '*.java') tests/try/Blocked.java
          java -cp out/classes Blocked out/filters.bin out/website/requests.tsv kurdfilm.krd | tee out/website/blocked.txt
      - name: Publish what it saw
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/try/publish.sh out/website website-

  emulator:
    name: The app on Android ${{ matrix.api }} TV
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: old   # Android 9: a web engine from 2018, like the café's box
            api: 28
          - name: new   # Android 14: a new web engine
            api: 34
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download filters -p filters.bin -D app/src/main/assets --clobber
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk twilight-movies.apk
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app, step by step
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash tests/try/emulator.sh twilight-movies.apk out ${{ matrix.name }}
      - name: Publish what it saw
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/try/publish.sh out
