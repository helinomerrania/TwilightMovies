name: Build the app

# Runs every time something in the project changes (or by hand from the Actions tab).
# A change to the app on the main branch is published as the latest release (twilight-movies.apk);
# a change to only the tests, the documents or the build's own steps isn't (the box would download
# the same app again), and other branches are only built, as a test.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, in order: two at once could each publish the same app, since neither would
# see the other's release yet
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # a fixed build machine, so GitHub updates don't change the build
    steps:
      - name: Get the project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the whole history, to see whether the app changed since the last release

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the app's scripts, texts and websites
        shell: bash
        run: |
          # tests/js: the scripts the app runs inside the websites, its texts (with any translation) and
          # sites.json. If one fails, nothing is built or published
          node tests/js/run.js 2>&1 | tee tests.log
          echo "::notice title=Tests::$(grep -h '^The ' tests.log | tr '\n' ' ')"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Test the app's Java and make the ad blocker's filters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tests/java: the app's plain-Java parts, the filter compiler and the architecture's rules. Then the
          # filter lists (tools/filters/lists.txt) made into the file that goes inside the app, and checked
          # (tools/filters/checks.txt). If a list can't be downloaded today or a check fails, the filters
          # published last (the release "filters") go in instead.
          tests/java/run.sh 2>&1 | tee -a tests.log
          echo "::notice title=Java tests::$(tail -n 1 tests.log)"
          mkdir -p app/src/main/assets
          if tools/filters/build.sh "$RUNNER_TEMP/filters" 2>&1 | tee filters.log; then
            cp "$RUNNER_TEMP/filters/filters.bin" app/src/main/assets/filters.bin
            echo "::notice title=Ad blocker filters::$(grep -h 'filters.bin:' filters.log | sed 's/^ *//')"
          elif gh release download filters -p filters.bin -D app/src/main/assets --clobber; then
            echo "::warning title=Ad blocker filters::Today's lists couldn't be made into filters (the log says why): the ones published last went in"
          else
            echo "::error title=Ad blocker filters::The lists couldn't be made into filters, and none were published yet"
            exit 1
          fi

      - name: Put in the app's keys
        shell: bash
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          # TMDB's key (the project's secret TMDB_KEY: its "API Key", or its "Read Access Token"), for the titles'
          # original pictures (ui/pictures.js), into ui/keys.js, which is empty in the project
          key=$(printf '%s' "$TMDB_KEY" | tr -d '[:space:]')
          if [[ "$key" =~ ^[0-9a-f]{32}$ || "$key" =~ ^eyJ[A-Za-z0-9._-]+$ ]]; then
            sed -i "s/tmdb: ''/tmdb: '$key'/" app/src/main/assets/gecko/ui/keys.js
            echo "::notice title=TMDB::TMDB's key is in: every title's poster from TMDB where it has it"
          elif [ -n "$key" ]; then
            echo "::warning title=TMDB::The secret TMDB_KEY is neither TMDB's API Key (32 letters and numbers) nor its Read Access Token: not put in"
          else
            echo "::notice title=TMDB::No secret TMDB_KEY yet: a title's poster is TMDB's only where one of its websites gives it"
          fi

      - name: Build the APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk twilight-movies.apk
          ls -l twilight-movies.apk

      - name: Show what went wrong
        if: failure()
        shell: bash
        run: |
          # Gradle's own explanation, any compile errors and any failed tests, as notes on the run
          # ("|| true": a search that finds nothing mustn't end the step before the notes are written)
          enc() { sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
          wrong=$(grep -A 12 "What went wrong" build.log 2>/dev/null | head -n 40 | enc || true)
          errors=$(grep -E -A 2 "error:|\.java:[0-9]+:" build.log 2>/dev/null | head -n 60 | enc || true)
          tests=$(grep "  FAIL " tests.log 2>/dev/null | head -n 40 | enc || true)
          filters=$(grep -E -A 30 "CHECKS FAILED|Couldn't download|Exception|error:" filters.log 2>/dev/null | head -n 40 | enc || true)
          [ -n "$wrong" ] && echo "::error title=What went wrong::$wrong"
          [ -n "$errors" ] && echo "::error title=Compile errors::$errors"
          [ -n "$tests" ] && echo "::error title=Failed tests::$tests"
          [ -n "$filters" ] && echo "::error title=Ad blocker filters::$filters"
          true

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v7
        with:
          name: twilight-movies
          path: twilight-movies.apk

      - name: Publish it as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Only when the app itself changed since the last release, or when run by hand
          git fetch --quiet --tags --force origin || true   # releases made since this build started
          last=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" > /dev/null \
             && git diff --quiet "$last" HEAD -- app build.gradle settings.gradle gradle.properties gradle; then
            echo "::notice title=Not published::The app is the same as in $last (only tests, documents or the build's own steps changed): nothing new to install."
            exit 0
          fi
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" twilight-movies.apk \
            --target "${{ github.sha }}" \
            --title "Twilight Movies, build ${{ github.run_number }}" \
            --notes "Install twilight-movies.apk on the TV box. It installs over the previous build, and keeps the website's sign-in and the app's settings." \
            --latest
          # Only the newest five builds are kept
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done
