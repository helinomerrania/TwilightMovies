pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Mozilla's own, for Firefox's engine (GeckoView) only
        maven {
            url = "https://maven.mozilla.org/maven2/"
            content { includeGroup "org.mozilla.geckoview" }
        }
    }
}

rootProject.name = "TwilightMovies"
include ':app'
